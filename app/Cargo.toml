[package]
name = "app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
proto.workspace = true
auth = { path = "../auth" }
server = { path = "../server" }
client = { path = "../client" }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-service = "0.7"
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }

[build-dependencies]
winresource = "0.1"
