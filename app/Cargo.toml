[package]
name = "app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
proto.workspace = true
server = { path = "../server" }
client = { path = "../client" }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }

[build-dependencies]
winresource = "0.1"
