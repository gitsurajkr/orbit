# Builds orbit.exe + ORBIT-Setup.exe on Windows and publishes them as a GitHub Release whenever a
# version tag (v1.2.3) is pushed. Every installed ORBIT checks the latest release and offers it.
# Use release.ps1 to bump the version, tag and push in one go.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the Cargo version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "tag v$tag doesn't match Cargo.toml version $ver" }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release -p proto -p app

      - name: Build orbit.exe
        run: cargo build --release -p app

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer + checksum
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\orbit.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          $h = (Get-FileHash dist\ORBIT-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ORBIT-Setup.exe" | Out-File -Encoding ascii dist\ORBIT-Setup.exe.sha256
          Copy-Item target\release\orbit.exe dist\orbit.exe

      - uses: softprops/action-gh-release@v2
        with:
          name: ORBIT v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/ORBIT-Setup.exe
            dist/ORBIT-Setup.exe.sha256
            dist/orbit.exe
